<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { font: 13px -apple-system, sans-serif; color: #222; line-height: 1.45; }
h1 { font-size: 24px; margin: 0 0 12px; }
.brand { display: flex; align-items: center; gap: 15px; margin-bottom: 14px; }
.brand img { width: 108px; height: 108px; object-fit: contain; }
.brand-name { color: #315f7a; font-size: 13px; font-weight: 600; letter-spacing: .03em; }
a { color: #2877a5; }
</style>
</head>
<body>
<div class="brand">
  <img src="__NEW_TEXT_FILE_ICON__" alt="New Text File icon">
  <div>
    <div class="brand-name">CUTE CAT STUDIOS</div>
    <h1>New Text File for Finder</h1>
  </div>
</div>
<p>Adds a native <strong>New Text File</strong> command to Finder’s right-click menu.</p>
<p>The extension creates an empty <code>.txt</code> document in the current folder and safely numbers duplicate names.</p>
<p>Made by <a href="https://cutecat.dev">Cute Cat Studios — cutecat.dev</a></p>
</body>
</html>
